name: SDK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/verify-javascript-package.mjs
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/generate.mjs --check
      - run: python -m pip install ./python build mypy
      - run: python -m unittest discover -s python/tests -v
      - run: mypy python/src/classive examples/python
      - run: python -m build python
