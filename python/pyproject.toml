[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "classive-sdk"
version = "0.1.2"
description = "Official synchronous and asynchronous Python SDK for the Classive educational content API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1"]
authors = [{name = "Classive Ltd"}]
keywords = ["classive", "sdk", "api-client", "education", "edtech", "lesson-generation", "course-generation"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Education",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://classive.app"
Documentation = "https://github.com/classive-hq/sdk/blob/main/python/README.md"
Repository = "https://github.com/classive-hq/sdk"
Issues = "https://github.com/classive-hq/sdk/issues"
Changelog = "https://github.com/classive-hq/sdk/blob/main/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/classive"]
